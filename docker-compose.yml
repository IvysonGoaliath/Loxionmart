version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: loxionmart
      POSTGRES_PASSWORD: loxionmart
      POSTGRES_DB: loxionmart
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql://loxionmart:loxionmart@db:5432/loxionmart
      SECRET_KEY: local-dev-secret-key
      ENVIRONMENT: development
      FRONTEND_URL: http://localhost:5173
    depends_on:
      - db
    volumes:
      - ./backend:/app
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  pgdata:
